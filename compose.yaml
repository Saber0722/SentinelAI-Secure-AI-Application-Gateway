# SentinelAI deployment: Caddy (public, HTTPS) -> Streamlit UI -> FastAPI gateway -> Ollama.
# Only Caddy publishes ports; the API and Ollama are reachable only on the internal network.
#
#   SENTINEL_ADMIN_TOKEN=$(openssl rand -hex 32) docker compose up -d --build
#
# Variables (put them in a .env next to this file): SENTINEL_ADMIN_TOKEN (required),
# SITE_ADDRESS (e.g. sentinelai-demo.centralindia.cloudapp.azure.com; default :80, plain HTTP),
# SENTINEL_MODEL_NAME (default qwen2.5:1.5b).

x-sentinel-env: &sentinel-env
  SENTINEL_MODEL_BACKEND: ollama
  SENTINEL_MODEL_NAME: ${SENTINEL_MODEL_NAME:-qwen2.5:1.5b}
  # Ollama runs in a sibling container, not on loopback. It is on the private compose
  # network only, so prompts still never leave the host.
  SENTINEL_MODEL_BASE_URL: http://ollama:11434
  SENTINEL_ALLOW_REMOTE_MODEL: "true"
  SENTINEL_INFERENCE_DEVICE: cpu
  SENTINEL_MODEL_TIMEOUT_S: "120"
  SENTINEL_ADMIN_TOKEN: ${SENTINEL_ADMIN_TOKEN:?set SENTINEL_ADMIN_TOKEN}
  # Per-client limit and a cap on simultaneous chats. Clients are identified by the header the UI
  # sets from Caddy's X-Forwarded-For; safe because only the UI can reach the API on this network.
  SENTINEL_RATE_LIMIT_PER_MINUTE: ${SENTINEL_RATE_LIMIT_PER_MINUTE:-30}
  SENTINEL_MAX_CONCURRENT_CHATS: ${SENTINEL_MAX_CONCURRENT_CHATS:-6}
  SENTINEL_TRUST_CLIENT_HEADER: "true"
  SENTINEL_CLASSIFIER_KIND: cascade
  SENTINEL_TORCH_THREADS: ${SENTINEL_TORCH_THREADS:-2}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  ollama:
    image: ollama/ollama:0.40.8
    restart: unless-stopped
    logging: *logging
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30

  # One-shot: download the model into the ollama volume (no-op when already present).
  ollama-pull:
    image: ollama/ollama:0.40.8
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${SENTINEL_MODEL_NAME:-qwen2.5:1.5b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: sentinelai:latest
    restart: unless-stopped
    logging: *logging
    environment: *sentinel-env
    volumes:
      - sentinel-var:/app/var
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      start_period: 180s
      retries: 10

  ui:
    image: sentinelai:latest
    restart: unless-stopped
    logging: *logging
    command: ["sentinelai", "ui", "--host", "0.0.0.0", "--port", "8501"]
    environment:
      SENTINEL_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - ui

volumes:
  ollama:
  sentinel-var:
  caddy-data:
